name: PP-0011 Authenticated CLI Closure Proof (nondeploying)
on:
  push:
    branches:
      - feature/pp0011-scoped-closure-candidate-20261115
    paths:
      - .github/workflows/pp0011-closure-cli-proof.yml
permissions:
  contents: read
  pull-requests: read
jobs:
  authenticated_cli_close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact protected main rev92 in isolated Actions workspace only
        shell: bash
        run: |
          set -euo pipefail
          git show baad35b96a8f48768a6b5682d2c9b145a69e7e43:.pro-papa/tasks.json > .pro-papa/tasks.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const b=readFileSync('.pro-papa/tasks.json');
          const blob=createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');
          const task=JSON.parse(b).tasks.find(t=>t.id==='PP-0011');
          if(blob!=='37a35059c4a426ae7f0d23997bae40b961df08aa' || task.status!=='in_progress' || task.evidence.length!==3)
            throw new Error('Not exact approved rev92 pre-closure state');
          console.log('PP0011_CLI_BASE_VERIFIED '+JSON.stringify({gitBlob:blob,taskStatus:task.status,evidenceCount:task.evidence.length}));
          NODE
      - name: Execute real CLI with ephemeral host-managed read-only GitHub token
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node bin/pro-papa.mjs close --id PP-0011 --root . > /tmp/pp0011-closure.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const report=JSON.parse(readFileSync('/tmp/pp0011-closure.json','utf8'));
          const b=readFileSync('.pro-papa/tasks.json');
          const blob=createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');
          const state=JSON.parse(b);
          const task=state.tasks.find(t=>t.id==='PP-0011');
          if(report.trustedReview?.verdict!=='PASS'||report.trustedReview?.reviewId!==5913367526||
             report.trustedReview?.reviewer?.login!=='papa4568'||
             report.trustedReview?.candidateSha!=='ca42ab27b5147ed169b7b3fc742fc3ce3b554433'||
             report.trustedReview?.baseSha!=='5d84f80cb36509fa20d50f87551461bba2804a79'||
             state.revision!==93||task?.status!=='verified'||!Number.isFinite(Date.parse(task.verifiedAt))||
             task.evidence.length!==3)throw new Error('Actual CLI close result did not meet authenticated review and state invariants');
          console.log('PP0011_AUTHENTICATED_CLI_CLOSE '+JSON.stringify({
           status:'pass',taskId:task.id,revision:state.revision,taskStatus:task.status,
           verifiedAt:task.verifiedAt,ledgerGitBlob:blob,reviewId:report.trustedReview.reviewId,
           reviewer:report.trustedReview.reviewer.login,reviewedHead:report.trustedReview.candidateSha,
           pinnedBase:report.trustedReview.baseSha,
           registeredEvidence:report.verifiedFiles,execution:'real node bin/pro-papa.mjs close',networkProvider:'GitHub REST via host-managed read-only GitHub Actions token',
           deployment:false,productionChanges:false
          }));
          NODE
