name: Review Identity
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
  # Re-evaluate every open PR targeting main when its comparison base advances.
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  github-approval:
    runs-on: ubuntu-latest
    steps:
      # Only trusted default-branch code sees the status-writing GitHub token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish pinned PR-head review integrity status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.ref_name }}
          TRUSTED_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: node bin/review-status.mjs
