name: Review Identity
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  github-approval:
    runs-on: ubuntu-latest
    steps:
      # Never execute or checkout PR-controlled code with a GitHub token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current GitHub PR review and reviewer identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node bin/pro-papa.mjs review-gate --repo "$PR_REPO" --pr "$PR_NUMBER"
