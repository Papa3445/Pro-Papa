name: PP-0009 one-time actual file-backed proof registration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pp0009-registration-preflight.yml'
      - '.pro-papa/evidence/PP-0009/**'
permissions:
  contents: read
jobs:
  real-registration:
    if: github.event.pull_request.head.repo.full_name == 'Papa3445/Pro-Papa' && github.event.pull_request.head.ref == 'feature/pp0009-authenticated-evidence-registration' && github.event.pull_request.base.sha == 'a63eef80628de79df7ddbe6f84f2158b5e90603a'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate review and register all real file-backed proofs with CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node bin/pro-papa.mjs review-status --id PP-0009 > review-gate.json
          node bin/pro-papa.mjs proof --id PP-0009 --kind artifact --actor chatgpt-implementation --file .pro-papa/evidence/PP-0009/production-oauth-smoke-2026-10-28.json --note 'Real connected MCP positive and GitHub Actions production denial smoke; reviewed PR 60' > proof-artifact.json
          node bin/pro-papa.mjs proof --id PP-0009 --kind test --actor chatgpt-implementation --file .pro-papa/evidence/PP-0009/ci-and-adversarial-results-2026-10-28.json --note 'Actual exact-head and postmerge 308/308 tests; real unauthenticated negative probes' > proof-test.json
          node bin/pro-papa.mjs proof --id PP-0009 --kind validation --actor chatgpt-implementation --file .pro-papa/evidence/PP-0009/production-validation-and-retention-2026-10-28.json --note 'Verified deploy SHA, no sensitive content, released digest, and historical preservation' > proof-validation.json
          node bin/pro-papa.mjs proof --id PP-0009 --kind review --actor papa4568 --file .pro-papa/evidence/PP-0009/independent-github-reviews-2026-10-28.json --note 'Actual authenticated independent GitHub PR 59 and PR 60 APPROVED reviews, provider checked' > proof-review.json
          node bin/pro-papa.mjs validate > canonical-validation.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const ledger=JSON.parse(readFileSync('.pro-papa/tasks.json'));
          const task=ledger.tasks.find(t=>t.id==='PP-0009');
          assert.equal(ledger.revision,84);
          assert.equal(task.status,'in_progress');
          assert.deepEqual(task.evidence.map(x=>x.kind),['artifact','test','validation','review']);
          assert.equal(task.evidence.at(-1).actor,'papa4568');
          assert.equal(ledger.tasks.find(x=>x.id==='PP-0007').evidence.length,85);
          const gate=JSON.parse(readFileSync('review-gate.json'));
          assert.equal(gate.verdict,'PASS');
          const valid=JSON.parse(readFileSync('canonical-validation.json'));
          assert.equal(valid.valid,true);
          console.log(JSON.stringify({status:'passed',revision:84,evidenceKinds:task.evidence.map(x=>x.kind),githubReviewVerdict:gate.verdict,legacyRecords:85}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pp0009-real-registered-ledger
          retention-days: 7
          if-no-files-found: error
          path: |
            .pro-papa/tasks.json
            proof-artifact.json
            proof-test.json
            proof-validation.json
            proof-review.json
            review-gate.json
            canonical-validation.json
