name: PP-0009 owner-authorized CLI closure candidate (no merge or deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pp0009-authorized-close.yml'
permissions:
  contents: read
jobs:
  actual-cli-close:
    if: github.event.pull_request.number == 62 && github.event.pull_request.head.repo.full_name == 'Papa3445/Pro-Papa' && github.event.pull_request.head.ref == 'feature/pp0009-authenticated-closure-preflight' && github.event.pull_request.base.sha == 'd44b586d1f2b7583c1670260e4fa851450086e4f'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d44b586d1f2b7583c1670260e4fa851450086e4f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate actual closure candidate only after explicit owner authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          #!/usr/bin/env bash
          # Prepared only. Do not run until the owner authorizes the PP-0009 transition.
          # Run in an isolated exact-source checkout using a host-provided read-only token.
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d44b586d1f2b7583c1670260e4fa851450086e4f
          test -n "${GITHUB_TOKEN:-}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=readFileSync('.pro-papa/tasks.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'),'936cd4e7272c27c0e682737579f2ad06d96e53db4e41414176814b8390481428');
          writeFileSync('pp0009-before.json',bytes,{flag:'wx'});
          NODE
          node bin/pro-papa.mjs review-status --id PP-0009 > pp0009-review-status.json
          node bin/pro-papa.mjs close --id PP-0009 > pp0009-cli-close.json
          node bin/pro-papa.mjs validate > pp0009-project-validation.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const before=JSON.parse(readFileSync('pp0009-before.json'));
          const after=JSON.parse(readFileSync('.pro-papa/tasks.json'));
          assert.equal(after.revision,85);
          const task=after.tasks.find(x=>x.id==='PP-0009');
          assert.equal(task.status,'verified');
          assert.ok(Number.isFinite(Date.parse(task.verifiedAt)));
          assert.equal(JSON.parse(readFileSync('pp0009-cli-close.json')).trustedReview.verdict,'PASS');
          assert.equal(JSON.parse(readFileSync('pp0009-project-validation.json')).valid,true);
          const normalized=structuredClone(after);
          normalized.revision=84;
          const original=normalized.tasks.find(x=>x.id==='PP-0009');
          original.status='in_progress';
          delete original.verifiedAt;
          assert.deepEqual(normalized,before);
          assert.equal(after.tasks.find(x=>x.id==='PP-0007').evidence.length,85);
          assert.ok(after.tasks.filter(x=>Number(x.id.slice(3))>=10).every(x=>x.status==='pending'));
          console.log(JSON.stringify({status:'passed',actualCliClose:true,revision:85,historicalStatePreserved:true,mergePerformed:false,productionChanged:false}));
          NODE
          # Capture the original CLI outputs and generated ledger as a runner artifact.
          # Update EXISTING PR62 with those exact bytes only after verification.
          # Run exact-head CI and independent closure-diff review. Never push main,
          # auto-merge, deploy, alter billing, or start dependent tasks from this script.
      - uses: actions/upload-artifact@v4
        with:
          name: pp0009-actual-cli-closure-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            .pro-papa/tasks.json
            pp0009-before.json
            pp0009-review-status.json
            pp0009-cli-close.json
            pp0009-project-validation.json
