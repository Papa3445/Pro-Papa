name: Verify Pro-Papa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check

  pp0006-native-audit-negative-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/pp-0006-reference-host'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production native fetch fails closed on inaccessible separate private audit store
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRO_PAPA_AUDIT_REPO: Papa3445/Pro-Papa-Audit
        run: |
          node --input-type=module -e '
            import { spawnSync } from "node:child_process";
            const request = JSON.stringify({ objective:"Benign unaudited-local-math-must-not-run",
              capability:"math.sum", inputs:{numbers:[7,9]} });
            const result=spawnSync(process.execPath,["bin/reference-host.mjs","--audit-required"],
              {input:request,encoding:"utf8"});
            if(result.error || result.signal) process.exit(1);
            let out; try {out=JSON.parse(result.stdout)}catch{process.exit(1)}
            if(result.status!==1 || out.status!=="audit_failed" ||
               out.audit?.status!=="failed" || out.execution!==null) process.exit(1);
            console.log("native audit negative smoke: authentic GitHub token scoped to source repo; separate private store inaccessible; fail-closed before local operation");
          '
      - name: Actual PP-0006 source adapter on reviewed candidate
        run: node bin/pro-papa.mjs adapter-check --id PP-0006 --file src/reference-host.mjs --actor chatgpt-implementation
