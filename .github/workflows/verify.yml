name: Verify Pro-Papa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: PP-0004 temporary trusted close verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/pp-0004-evidence-closeout'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/pro-papa.mjs close --id PP-0004
